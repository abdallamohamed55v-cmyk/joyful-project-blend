<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Megsy — Slide Deck</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style id="megsy-landing-base">
      /* =================================================================
         MEGSY — matches the megsy.ai landing page.
         Pitch-black bg, electric purple primary, Space Grotesk display.
         All sizing in container-query units (cqw) so slides scale on mobile.
         ================================================================= */

      :root {
        --m-bg:        #000000;
        --m-bg-2:      #0a0a0a;
        --m-card:      #0d0d0f;
        --m-fg:        #ebebeb;
        --m-fg-2:      rgba(235,235,235,0.72);
        --m-muted:     rgba(235,235,235,0.48);
        --m-primary:   #8b5cf6;       /* hsl(262 60% 60%) — landing primary */
        --m-primary-2: #a78bfa;
        --m-accent:    #ec4899;       /* pink accent for contrast */
        --m-border:    rgba(255,255,255,0.10);
        --m-border-2:  rgba(255,255,255,0.18);
        --m-glow:      0 0 60px rgba(139,92,246,0.35);
      }

      html, body {
        background: var(--m-bg);
        color: var(--m-fg);
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }

      .lov-deck {
        background: var(--m-bg) !important;
        color: var(--m-fg) !important;
        font-family: "Inter", system-ui, sans-serif !important;
      }

      .lov-deck .lov-section {
        background:
          radial-gradient(circle at 12% 12%, rgba(139,92,246,0.13), transparent 42%),
          radial-gradient(circle at 92% 88%, rgba(236,72,153,0.10), transparent 48%),
          var(--m-bg) !important;
        color: var(--m-fg) !important;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--m-border) !important;
      }

      /* Subtle dot grid texture */
      .lov-deck .lov-section::before {
        content: "";
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.2px);
        background-size: 2.4cqw 2.4cqw;
        pointer-events: none;
        z-index: 0;
        opacity: 0.7;
      }
      .lov-deck .lov-section > * { position: relative; z-index: 1; }

      /* ── Typography (cqw scaled) ───────────────────────────────────── */
      .lov-deck .lov-h1,
      .lov-deck .lov-h2,
      .lov-deck .lov-h3,
      .lov-deck .lov-quote,
      .lov-deck .lov-bignum-value,
      .lov-deck .lov-stat-value,
      .lov-deck .lov-callout-text {
        font-family: "Space Grotesk", "Inter", sans-serif !important;
        color: var(--m-fg) !important;
        font-weight: 700 !important;
        letter-spacing: -0.025em !important;
        text-transform: uppercase;
      }
      .lov-deck .lov-h1 { font-size: clamp(28px, 9.4cqw, 200px) !important; line-height: 0.95 !important; font-weight: 700 !important; }
      .lov-deck .lov-h2 { font-size: clamp(22px, 6.6cqw, 150px) !important; line-height: 1.0  !important; }
      .lov-deck .lov-h3 { font-size: clamp(16px, 3.2cqw, 64px)  !important; line-height: 1.15 !important; font-weight: 600 !important; text-transform: none; letter-spacing: -0.015em !important; }
      .lov-deck .lov-callout-text {
        font-size: clamp(20px, 6cqw, 130px) !important;
        line-height: 1.0 !important;
      }

      /* Headline accent — last word gets the purple glow, like the landing hero */
      .lov-deck .lov-cover .lov-h1 .lov-accent-word,
      .lov-deck .lov-h1 b,
      .lov-deck .lov-h1 strong {
        color: var(--m-primary) !important;
        text-shadow: 0 0 40px rgba(139,92,246,0.55);
      }

      .lov-deck .lov-subtitle,
      .lov-deck .lov-body,
      .lov-deck .lov-bullets li,
      .lov-deck .lov-stat-label,
      .lov-deck .lov-cite {
        font-family: "Inter", sans-serif !important;
        color: var(--m-fg-2) !important;
        font-weight: 400 !important;
        text-transform: none !important;
        letter-spacing: 0 !important;
      }
      .lov-deck .lov-subtitle { font-size: clamp(12px, 2.0cqw, 38px) !important; line-height: 1.45 !important; max-width: 78cqw; color: var(--m-fg-2) !important; }
      .lov-deck .lov-body     { font-size: clamp(11px, 1.7cqw, 30px) !important; line-height: 1.6 !important; max-width: 78cqw; }

      .lov-deck .lov-kicker,
      .lov-deck .lov-index {
        font-family: "Space Grotesk", sans-serif !important;
        color: var(--m-primary) !important;
        text-transform: uppercase;
        letter-spacing: 0.32em !important;
        font-weight: 600 !important;
      }
      .lov-deck .lov-kicker {
        font-size: clamp(9px, 1.05cqw, 16px) !important;
        margin-bottom: 1.6cqw;
        display: inline-flex; align-items: center; gap: 0.8cqw;
        padding: 0.6cqw 1.4cqw;
        border: 1px solid var(--m-border-2);
        border-radius: 999px;
        background: rgba(139,92,246,0.08);
        backdrop-filter: blur(6px);
      }

      /* ── Layout primitives ─────────────────────────────────────────── */
      .lov-deck .lov-content {
        padding: 6cqw 7cqw;
        height: 100%;
        display: flex; flex-direction: column;
        justify-content: center;
      }
      .lov-deck .lov-content-center { text-align: center; align-items: center; }
      .lov-deck .lov-content-center .lov-subtitle,
      .lov-deck .lov-content-center .lov-body { margin-left: auto; margin-right: auto; }

      /* ── Cards / callouts: glassy dark cards ──────────────────────── */
      .lov-deck .lov-three > *,
      .lov-deck .lov-twocol > *,
      .lov-deck .lov-stats-section .lov-stat,
      .lov-deck .lov-process .lov-step,
      .lov-deck .lov-timeline > *,
      .lov-deck .lov-gallery > *,
      .lov-deck .lov-compare > * {
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)) !important;
        border: 1px solid var(--m-border) !important;
        border-radius: 1.4cqw !important;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.06),
          0 12px 48px rgba(0,0,0,0.5) !important;
        color: var(--m-fg) !important;
        padding: 2.8cqw 2.6cqw !important;
        backdrop-filter: blur(8px);
      }

      /* ── Images: rounded with purple glow ridge ───────────────────── */
      .lov-deck .lov-media {
        border: 1px solid var(--m-border-2);
        border-radius: 1.4cqw;
        background: var(--m-card);
        overflow: hidden;
        aspect-ratio: 4/3;
        position: relative;
        box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08);
      }
      .lov-deck .lov-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .lov-deck .lov-media-empty {
        display: flex; align-items: center; justify-content: center;
        color: var(--m-primary);
      }
      .lov-deck .lov-media-empty .lov-star-svg { width: 36%; height: 36%; opacity: 0.6; }

      /* ── COVER ─────────────────────────────────────────────────────── */
      .lov-deck .lov-cover {
        background:
          radial-gradient(circle at 50% 30%, rgba(139,92,246,0.28), transparent 55%),
          radial-gradient(circle at 50% 90%, rgba(236,72,153,0.16), transparent 60%),
          var(--m-bg) !important;
      }
      .lov-deck .lov-cover .lov-content {
        align-items: center; text-align: center;
        padding: 8cqw 7cqw;
      }
      .lov-deck .lov-cover .lov-h1 {
        font-size: clamp(24px, 8cqw, 180px) !important;
        max-width: 92%;
        font-weight: 700 !important;
        word-wrap: break-word;
        overflow-wrap: break-word;
        hyphens: auto;
      }
      .lov-deck .lov-cover .lov-subtitle {
        margin-top: 2.6cqw;
        font-size: clamp(13px, 2.2cqw, 42px) !important;
        color: var(--m-fg-2) !important;
        max-width: 72cqw;
      }
      .lov-deck .lov-cover-bg {
        position: absolute; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
        opacity: 0.08; filter: saturate(0.6) contrast(1.1) blur(2px);
        z-index: 0; mix-blend-mode: screen;
      }
      .lov-deck .lov-cover-veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
        z-index: 0;
      }

      /* Glowing star ornament floating on cover */
      .lov-deck .lov-cover::after {
        content: "";
        position: absolute;
        right: 7cqw; top: 7cqw;
        width: 6cqw; height: 6cqw;
        background:
          radial-gradient(circle, var(--m-primary) 0%, transparent 60%);
        filter: blur(4px);
        opacity: 0.7;
        z-index: 2; pointer-events: none;
        animation: m-pulse 3s ease-in-out infinite;
      }
      @keyframes m-pulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.15); } }

      /* ── QUOTE ─────────────────────────────────────────────────────── */
      .lov-deck .lov-quote-section {
        background:
          radial-gradient(circle at 50% 50%, rgba(139,92,246,0.10), transparent 60%),
          var(--m-bg) !important;
      }
      .lov-deck .lov-quote {
        font-size: clamp(20px, 5.0cqw, 110px) !important;
        font-weight: 500 !important;
        line-height: 1.18 !important;
        max-width: 80cqw;
        color: var(--m-fg) !important;
        text-transform: none !important;
        letter-spacing: -0.02em !important;
      }
      .lov-deck .lov-quote-mark {
        font-family: "Space Grotesk", sans-serif !important;
        color: var(--m-primary) !important;
        font-size: clamp(80px, 22cqw, 460px) !important;
        line-height: 0.55;
        margin-bottom: -2cqw;
        font-weight: 700;
        opacity: 0.8;
      }
      .lov-deck .lov-cite {
        margin-top: 3cqw;
        font-size: clamp(11px, 1.5cqw, 24px) !important;
        letter-spacing: 0.18em !important;
        color: var(--m-muted) !important;
        text-transform: uppercase;
      }

      /* ── STATS ─────────────────────────────────────────────────────── */
      .lov-deck .lov-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(18cqw, 200px), 1fr));
        gap: 2.6cqw;
        margin-top: 4cqw;
        width: 100%;
      }
      .lov-deck .lov-stat { text-align: left !important; }
      .lov-deck .lov-stat-value {
        font-size: clamp(36px, 8.5cqw, 180px) !important;
        background: linear-gradient(135deg, var(--m-primary) 0%, var(--m-primary-2) 50%, var(--m-accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent !important;
        display: block;
        line-height: 0.95;
        font-weight: 700 !important;
      }
      .lov-deck .lov-stat-label {
        text-transform: uppercase;
        letter-spacing: 0.22em !important;
        font-size: clamp(9px, 1.05cqw, 16px) !important;
        margin-top: 1.2cqw;
        color: var(--m-muted) !important;
        font-weight: 600 !important;
      }
      .lov-deck .lov-bignum-value {
        font-size: clamp(72px, 24cqw, 520px) !important;
        line-height: 0.85;
        background: linear-gradient(135deg, var(--m-primary), var(--m-accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent !important;
        font-weight: 700 !important;
      }
      .lov-deck .lov-bignum-label {
        font-family: "Space Grotesk", sans-serif !important;
        font-size: clamp(11px, 1.5cqw, 26px) !important;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: var(--m-fg-2) !important;
        margin-top: 1.2cqw;
        font-weight: 600 !important;
      }

      /* ── BULLETS — purple checkmarks ───────────────────────────────── */
      .lov-deck .lov-bullets {
        list-style: none; padding: 0; margin: 3.4cqw 0 0 0;
        display: flex; flex-direction: column; gap: 1.6cqw;
        max-width: 80cqw;
      }
      .lov-deck .lov-bullets li {
        position: relative;
        padding-left: 4.6cqw;
        font-size: clamp(12px, 1.85cqw, 30px) !important;
        line-height: 1.45 !important;
        color: var(--m-fg-2) !important;
      }
      .lov-deck .lov-bullets li::before {
        content: "";
        position: absolute;
        left: 0; top: 0.55cqw;
        width: 2.4cqw; height: 2.4cqw;
        background: linear-gradient(135deg, var(--m-primary), var(--m-accent));
        border-radius: 0.6cqw;
        box-shadow: 0 6px 18px rgba(139,92,246,0.45);
      }
      .lov-deck .lov-bullets li::after {
        content: "";
        position: absolute;
        left: 0.78cqw; top: 1.05cqw;
        width: 0.85cqw; height: 0.45cqw;
        border-left: 0.22cqw solid #ffffff;
        border-bottom: 0.22cqw solid #ffffff;
        transform: rotate(-45deg);
      }

      /* ── TWO-COL ───────────────────────────────────────────────────── */
      .lov-deck .lov-twocol .lov-content,
      .lov-deck .lov-twocol > .lov-content {
        display: grid !important;
        grid-template-columns: 1.05fr 1fr;
        gap: 4cqw;
        align-items: center;
      }
      .lov-deck .lov-twocol > * {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        backdrop-filter: none !important;
      }
      .lov-deck .lov-twocol .lov-media { aspect-ratio: 4/5; height: 100%; }

      /* ── THREE-COL ─────────────────────────────────────────────────── */
      .lov-deck .lov-three .lov-grid,
      .lov-deck .lov-three > .lov-content .lov-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2.4cqw;
        margin-top: 4cqw;
      }
      .lov-deck .lov-three .lov-grid > * {
        display: flex; flex-direction: column; gap: 1.2cqw;
        position: relative;
      }
      .lov-deck .lov-three .lov-grid > *::before {
        counter-increment: pillar;
        content: counter(pillar, decimal-leading-zero);
        font-family: "Space Grotesk", sans-serif;
        font-size: 3.6cqw;
        background: linear-gradient(135deg, var(--m-primary), var(--m-accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .lov-deck .lov-three > .lov-content { counter-reset: pillar; }
      .lov-deck .lov-three h3,
      .lov-deck .lov-three .lov-grid h3 {
        font-family: "Space Grotesk", sans-serif !important;
        font-size: clamp(15px, 2.6cqw, 42px) !important;
        color: var(--m-fg) !important;
        margin: 0;
        font-weight: 600 !important;
        text-transform: none !important;
        letter-spacing: -0.01em !important;
      }
      .lov-deck .lov-three .lov-grid p {
        font-size: clamp(11px, 1.5cqw, 24px) !important;
        line-height: 1.5 !important;
        color: var(--m-fg-2) !important;
        margin: 0;
      }

      /* ── IMAGE FULL / IMG-TOP ─────────────────────────────────────── */
      .lov-deck .lov-imgfull { padding: 0; }
      .lov-deck .lov-imgfull .lov-cover-bg { opacity: 0.55; mix-blend-mode: screen; }
      .lov-deck .lov-imgfull .lov-content {
        background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.85) 100%);
        color: var(--m-fg) !important;
        justify-content: flex-end;
        padding-bottom: 6cqw;
      }
      .lov-deck .lov-imgtop .lov-content { padding-top: 3cqw; }
      .lov-deck .lov-imgtop .lov-media { aspect-ratio: 21/9; margin-bottom: 4cqw; }

      /* ── PROCESS / TIMELINE ───────────────────────────────────────── */
      .lov-deck .lov-process .lov-grid,
      .lov-deck .lov-timeline .lov-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(20cqw, 200px), 1fr));
        gap: 2.4cqw;
        margin-top: 4cqw;
      }
      .lov-deck .lov-process .lov-step-num,
      .lov-deck .lov-timeline .lov-step-num {
        font-family: "Space Grotesk", sans-serif !important;
        font-size: clamp(28px, 6cqw, 110px) !important;
        background: linear-gradient(135deg, var(--m-primary), var(--m-accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 0.9;
        font-weight: 700 !important;
        display: block;
        margin-bottom: 0.8cqw;
      }

      /* ── GALLERY ───────────────────────────────────────────────────── */
      .lov-deck .lov-gallery .lov-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(20cqw, 200px), 1fr));
        gap: 2cqw;
        margin-top: 3cqw;
      }
      .lov-deck .lov-gallery .lov-grid > * {
        padding: 0 !important;
        aspect-ratio: 1;
        overflow: hidden;
        position: relative;
      }
      .lov-deck .lov-gallery .lov-grid > * img { width: 100%; height: 100%; object-fit: cover; }

      /* ── COMPARE ───────────────────────────────────────────────────── */
      .lov-deck .lov-compare .lov-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3cqw;
        margin-top: 3.4cqw;
        position: relative;
      }

      /* ── CALLOUT / MANIFESTO ──────────────────────────────────────── */
      .lov-deck .lov-callout {
        background:
          radial-gradient(circle at 50% 40%, rgba(139,92,246,0.22), transparent 55%),
          var(--m-bg) !important;
      }
      .lov-deck .lov-callout .lov-content {
        max-width: 88cqw; text-align: center;
      }

      /* ── FOOTER INDEX PILL "01 / 18" ──────────────────────────────── */
      .lov-deck .lov-index {
        position: absolute;
        bottom: 3cqw; right: 4cqw;
        background: linear-gradient(135deg, var(--m-primary), var(--m-accent)) !important;
        color: #ffffff !important;
        padding: 0.7cqw 1.6cqw;
        border-radius: 999px;
        font-size: clamp(9px, 1.0cqw, 15px) !important;
        letter-spacing: 0.22em !important;
        font-weight: 700 !important;
        box-shadow: 0 8px 24px rgba(139,92,246,0.45);
      }
    </style>
  </head>
  <body class="lov-deck">
    <!-- Body is replaced by the renderer with composed <section class="lov-section">…</section> per slide. -->
  </body>
</html>
