<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odyssey Classical Deck</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <style id="odyssey-base">
      /* =================================================================
         ODYSSEY CLASSICAL — museum-grade parchment editorial.
         Warm parchment · deep teal · terracotta · burnished gold.
         Cinzel kickers (engraved caps), Cormorant Garamond serif titles,
         Inter body. Greek-key motifs, columnar elegance.
         All sizing in cqw so it scales perfectly inside the chat card.
         ================================================================= */

      :root {
        --o-parchment:   #ECE0C4;
        --o-parchment-2: #F4EBD3;
        --o-paper:       #F8EFD8;
        --o-card:        #F4E9CC;
        --o-card-2:      #EFE2BD;
        --o-ink:         #1A2326;
        --o-ink-2:       #2F3F44;
        --o-teal:        #1B4E55;
        --o-teal-2:      #2B7079;
        --o-teal-3:      #4E9098;
        --o-terracotta:  #B14A2E;
        --o-terracotta-2:#D26A45;
        --o-gold:        #B08534;
        --o-gold-2:      #D4AC5A;
        --o-muted:       #6C7A7E;
        --o-rule:        rgba(27,78,85,0.22);
      }

      html, body { background: var(--o-parchment); margin: 0; }

      .lov-deck {
        background: var(--o-parchment) !important;
        color: var(--o-ink) !important;
        font-family: "Inter", "Helvetica Neue", system-ui, sans-serif !important;
      }

      .lov-deck .lov-section {
        background:
          radial-gradient(circle at 0% 0%, rgba(176,133,52,0.10), transparent 42%),
          radial-gradient(circle at 100% 100%, rgba(27,78,85,0.08), transparent 42%),
          linear-gradient(180deg, var(--o-paper) 0%, var(--o-parchment) 100%) !important;
        color: var(--o-ink) !important;
        position: relative;
        overflow: hidden;
      }

      /* Parchment grain + soft vignette */
      .lov-deck .lov-section::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
          radial-gradient(rgba(120,90,40,0.07) 0.8px, transparent 1.2px),
          radial-gradient(rgba(27,78,85,0.05) 0.8px, transparent 1.2px);
        background-size: 0.7cqw 0.7cqw, 1.2cqw 1.2cqw;
        background-position: 0 0, 0.35cqw 0.6cqw;
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
      }
      .lov-deck .lov-section::after {
        content: "";
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(60,40,15,0.18) 100%),
          /* Greek-key motif at top and bottom */
          repeating-linear-gradient(90deg, transparent 0 2cqw, transparent 2cqw 2cqw);
        pointer-events: none;
        z-index: 0;
      }
      .lov-deck .lov-section > * { position: relative; z-index: 1; }

      /* Greek-key border bands at top & bottom of every slide */
      .lov-deck .lov-section .lov-content::before,
      .lov-deck .lov-section .lov-content::after {
        content: "";
        position: absolute;
        left: 6cqw; right: 6cqw;
        height: 1.4cqw;
        background:
          linear-gradient(var(--o-teal), var(--o-teal)) 0 0/100% 0.18cqw no-repeat,
          linear-gradient(var(--o-teal), var(--o-teal)) 0 100%/100% 0.18cqw no-repeat,
          repeating-linear-gradient(90deg,
            var(--o-teal) 0 0.3cqw,
            transparent 0.3cqw 0.9cqw,
            var(--o-teal) 0.9cqw 1.2cqw,
            transparent 1.2cqw 2.4cqw);
        opacity: 0.55;
        z-index: 2;
      }
      .lov-deck .lov-section .lov-content::before { top: 3cqw; }
      .lov-deck .lov-section .lov-content::after  { bottom: 3cqw; }

      /* ── Typography (cqw) ────────────────────────────────────────── */
      .lov-deck .lov-h1,
      .lov-deck .lov-h2,
      .lov-deck .lov-h3,
      .lov-deck .lov-bignum-value,
      .lov-deck .lov-stat-value,
      .lov-deck .lov-quote,
      .lov-deck .lov-callout-text {
        font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif !important;
        color: var(--o-teal) !important;
        font-weight: 500 !important;
        letter-spacing: -0.012em;
      }
      .lov-deck .lov-h1 { font-size: clamp(28px, 9.5cqw, 200px) !important; line-height: 1.0 !important; font-weight: 500 !important; }
      .lov-deck .lov-h2 { font-size: clamp(22px, 6.8cqw, 150px) !important; line-height: 1.06 !important; font-weight: 500 !important; }
      .lov-deck .lov-h3 { font-size: clamp(15px, 3.2cqw, 60px)  !important; line-height: 1.18 !important; font-weight: 600 !important; color: var(--o-ink) !important; }
      .lov-deck .lov-callout-text {
        font-size: clamp(20px, 6cqw, 130px) !important;
        line-height: 1.1 !important;
        font-style: italic;
      }

      /* Italic accent on the LAST WORD of every h1/h2 — editorial flourish */
      .lov-deck .lov-h1 em,
      .lov-deck .lov-h2 em {
        font-style: italic; color: var(--o-terracotta);
      }

      .lov-deck .lov-subtitle,
      .lov-deck .lov-body,
      .lov-deck .lov-bullets li,
      .lov-deck .lov-stat-label,
      .lov-deck .lov-cite {
        font-family: "Inter", sans-serif !important;
        color: var(--o-ink-2) !important;
        font-weight: 400 !important;
      }
      .lov-deck .lov-subtitle { font-size: clamp(11px, 1.95cqw, 36px) !important; line-height: 1.5 !important; max-width: 70cqw; font-style: italic; }
      .lov-deck .lov-body     { font-size: clamp(10px, 1.6cqw, 28px)  !important; line-height: 1.6  !important; max-width: 70cqw; }

      .lov-deck .lov-kicker,
      .lov-deck .lov-index {
        font-family: "Cinzel", "Trajan Pro", serif !important;
        color: var(--o-terracotta) !important;
        text-transform: uppercase;
        letter-spacing: 0.42em !important;
        font-weight: 600 !important;
      }
      .lov-deck .lov-kicker {
        font-size: clamp(8px, 1cqw, 16px) !important;
        margin-bottom: 2cqw;
        display: inline-flex; align-items: center; gap: 1cqw;
      }
      .lov-deck .lov-kicker::before,
      .lov-deck .lov-kicker::after {
        content: ""; display: inline-block;
        width: 3cqw; height: 0.18cqw;
        background: currentColor;
        opacity: 0.7;
      }

      /* ── Content layout ──────────────────────────────────────────── */
      .lov-deck .lov-content {
        padding: 9cqw 8cqw;
        height: 100%;
        display: flex; flex-direction: column;
        justify-content: center;
        position: relative;
      }
      .lov-deck .lov-content-center { text-align: center; align-items: center; }
      .lov-deck .lov-content-center .lov-subtitle,
      .lov-deck .lov-content-center .lov-body { margin-left: auto; margin-right: auto; }

      /* ── Cards / pillars / stats ─────────────────────────────────── */
      .lov-deck .lov-three > *,
      .lov-deck .lov-twocol > *,
      .lov-deck .lov-stats-section .lov-stat,
      .lov-deck .lov-process .lov-step,
      .lov-deck .lov-timeline > *,
      .lov-deck .lov-compare > * {
        background: var(--o-card) !important;
        border: 0.12cqw solid var(--o-rule) !important;
        border-radius: 0.6cqw !important;
        color: var(--o-ink) !important;
        padding: 3cqw 2.8cqw !important;
        position: relative;
      }
      .lov-deck .lov-three > *::before,
      .lov-deck .lov-twocol > *::before,
      .lov-deck .lov-compare > *::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 0;
        height: 0.25cqw;
        background: var(--o-terracotta);
      }

      /* ── Images: bordered frames with gold inset ─────────────────── */
      .lov-deck .lov-media {
        border-radius: 0.4cqw;
        background: var(--o-card-2);
        overflow: hidden;
        aspect-ratio: 4/3;
        position: relative;
        box-shadow:
          inset 0 0 0 0.3cqw var(--o-card-2),
          inset 0 0 0 0.45cqw var(--o-gold),
          inset 0 0 0 0.6cqw var(--o-card-2),
          0 2cqw 4cqw -1.5cqw rgba(27,78,85,0.35);
      }
      .lov-deck .lov-media img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(0.08) saturate(0.95); }
      .lov-deck .lov-media-empty {
        display: flex; align-items: center; justify-content: center;
        color: var(--o-terracotta);
      }
      .lov-deck .lov-media-empty .lov-star-svg { width: 38%; height: 38%; }

      /* ── COVER ───────────────────────────────────────────────────── */
      .lov-deck .lov-cover {
        background:
          radial-gradient(circle at 80% 18%, rgba(176,133,52,0.22), transparent 50%),
          radial-gradient(circle at 12% 80%, rgba(27,78,85,0.18), transparent 50%),
          linear-gradient(180deg, var(--o-paper) 0%, var(--o-parchment) 100%) !important;
      }
      .lov-deck .lov-cover .lov-content {
        align-items: center; text-align: center;
        padding: 10cqw 8cqw;
      }
      .lov-deck .lov-cover .lov-h1 {
        font-style: italic;
        font-weight: 500 !important;
        font-size: clamp(34px, 13cqw, 280px) !important;
        max-width: 92%;
      }
      .lov-deck .lov-cover .lov-subtitle {
        margin-top: 3.5cqw;
        font-family: "Cinzel", serif !important;
        text-transform: uppercase;
        letter-spacing: 0.55em !important;
        font-size: clamp(9px, 1.4cqw, 22px) !important;
        color: var(--o-ink) !important;
        font-style: normal !important;
        font-weight: 500 !important;
        max-width: 70cqw;
      }
      .lov-deck .lov-cover-bg {
        position: absolute; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
        opacity: 0.22; filter: sepia(0.55) saturate(0.65) contrast(0.95);
        z-index: 0; mix-blend-mode: multiply;
      }
      .lov-deck .lov-cover-veil {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at center, transparent 40%, rgba(236,224,196,0.85) 100%),
          linear-gradient(180deg, rgba(236,224,196,0.45) 0%, rgba(236,224,196,0.92) 100%);
        z-index: 0;
      }

      /* Wax-seal ornament on cover & quote */
      .lov-deck .lov-cover .lov-content::before,
      .lov-deck .lov-quote-section .lov-content::before {
        content: "Ω";
        position: absolute;
        top: 6cqw; left: 50%;
        transform: translateX(-50%);
        width: 8cqw; height: 8cqw;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(circle at 35% 35%, var(--o-terracotta-2), var(--o-terracotta) 70%);
        color: var(--o-paper);
        font-family: "Cormorant Garamond", serif;
        font-size: 4.5cqw;
        font-weight: 700;
        border-radius: 50%;
        box-shadow:
          inset 0 0 0 0.25cqw rgba(255,255,255,0.18),
          inset 0 -0.4cqw 1cqw rgba(0,0,0,0.25),
          0 1cqw 2cqw -0.5cqw rgba(177,74,46,0.5);
        z-index: 3;
        background-image: none;
        background-color: var(--o-terracotta);
      }

      /* ── QUOTE ───────────────────────────────────────────────────── */
      .lov-deck .lov-quote-section {
        background:
          linear-gradient(180deg, var(--o-paper) 0%, var(--o-parchment-2) 100%) !important;
      }
      .lov-deck .lov-quote {
        font-size: clamp(20px, 5cqw, 110px) !important;
        font-style: italic;
        font-weight: 400 !important;
        line-height: 1.18 !important;
        max-width: 78cqw;
        color: var(--o-teal) !important;
      }
      .lov-deck .lov-quote-mark {
        font-family: "Cormorant Garamond", serif !important;
        color: var(--o-terracotta) !important;
        font-size: clamp(80px, 22cqw, 460px) !important;
        line-height: 0.55;
        font-style: italic;
        margin-bottom: -1cqw;
        font-weight: 700;
      }
      .lov-deck .lov-cite {
        margin-top: 3cqw;
        font-family: "Cinzel", serif !important;
        font-style: normal;
        text-transform: uppercase;
        letter-spacing: 0.4em !important;
        font-size: clamp(9px, 1.25cqw, 20px) !important;
        color: var(--o-muted) !important;
        font-weight: 500 !important;
      }

      /* ── STATS ───────────────────────────────────────────────────── */
      .lov-deck .lov-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(18cqw, 200px), 1fr));
        gap: 2.5cqw;
        margin-top: 4cqw;
        width: 100%;
      }
      .lov-deck .lov-stat { text-align: center !important; }
      .lov-deck .lov-stat::before { display: none !important; }
      .lov-deck .lov-stat-value {
        font-size: clamp(36px, 9cqw, 200px) !important;
        color: var(--o-terracotta) !important;
        display: block;
        line-height: 0.95;
        font-style: italic;
        font-weight: 500 !important;
      }
      .lov-deck .lov-stat:nth-child(3n+2) .lov-stat-value { color: var(--o-teal) !important; }
      .lov-deck .lov-stat:nth-child(3n)   .lov-stat-value { color: var(--o-gold) !important; }
      .lov-deck .lov-stat-label {
        font-family: "Cinzel", serif !important;
        text-transform: uppercase;
        letter-spacing: 0.32em !important;
        font-size: clamp(8px, 0.95cqw, 14px) !important;
        margin-top: 1.4cqw;
        color: var(--o-ink-2) !important;
        font-weight: 500 !important;
      }
      .lov-deck .lov-bignum-value {
        font-size: clamp(72px, 26cqw, 540px) !important;
        line-height: 0.85;
        color: var(--o-terracotta) !important;
        font-style: italic;
        font-weight: 500 !important;
      }
      .lov-deck .lov-bignum-label {
        font-family: "Cinzel", serif !important;
        font-size: clamp(10px, 1.4cqw, 24px) !important;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        color: var(--o-teal) !important;
        margin-top: 2cqw;
        font-weight: 500 !important;
      }

      /* ── BULLETS — laurel-leaf markers ──────────────────────────── */
      .lov-deck .lov-bullets {
        list-style: none; padding: 0; margin: 3.4cqw 0 0 0;
        display: flex; flex-direction: column; gap: 1.6cqw;
        max-width: 75cqw;
      }
      .lov-deck .lov-bullets li {
        position: relative;
        padding-left: 4.5cqw;
        font-size: clamp(11px, 1.8cqw, 30px) !important;
        line-height: 1.45 !important;
        color: var(--o-ink-2) !important;
      }
      .lov-deck .lov-bullets li::before {
        content: "";
        position: absolute;
        left: 0; top: 0.7cqw;
        width: 2.2cqw; height: 2.2cqw;
        background: var(--o-terracotta);
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      }
      .lov-deck .lov-bullets li::after {
        content: "";
        position: absolute;
        left: 0.85cqw; top: 1.25cqw;
        width: 0.5cqw; height: 0.5cqw;
        background: var(--o-paper);
        border-radius: 50%;
      }

      /* ── TWO-COL / SPLIT ─────────────────────────────────────────── */
      .lov-deck .lov-twocol .lov-content,
      .lov-deck .lov-twocol > .lov-content {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 4cqw;
        align-items: center;
      }
      .lov-deck .lov-twocol > * {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .lov-deck .lov-twocol > *::before { display: none !important; }
      .lov-deck .lov-twocol .lov-media { aspect-ratio: 4/5; height: 100%; }

      /* ── THREE-COL / PILLARS ─────────────────────────────────────── */
      .lov-deck .lov-three .lov-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2.4cqw;
        margin-top: 4cqw;
      }
      .lov-deck .lov-three .lov-grid > * {
        display: flex; flex-direction: column; gap: 1.2cqw;
        counter-increment: pillar;
      }
      .lov-deck .lov-three > .lov-content { counter-reset: pillar; }
      .lov-deck .lov-three .lov-grid > *::after {
        content: counter(pillar, upper-roman);
        position: absolute;
        top: 1.6cqw; right: 2cqw;
        font-family: "Cinzel", serif;
        font-size: 2cqw;
        letter-spacing: 0.1em;
        color: var(--o-terracotta);
        font-weight: 600;
        opacity: 0.8;
      }
      .lov-deck .lov-three .lov-grid h3 {
        font-family: "Cormorant Garamond", serif !important;
        font-size: clamp(15px, 2.6cqw, 44px) !important;
        color: var(--o-teal) !important;
        margin: 0;
        font-weight: 600 !important;
        font-style: italic;
        padding-right: 4cqw;
      }
      .lov-deck .lov-three .lov-grid p {
        font-size: clamp(10px, 1.45cqw, 24px) !important;
        line-height: 1.5 !important;
        color: var(--o-ink-2) !important;
        margin: 0;
      }

      /* ── IMAGE FULL / IMG-TOP ────────────────────────────────────── */
      .lov-deck .lov-imgfull { padding: 0; }
      .lov-deck .lov-imgfull .lov-cover-bg {
        opacity: 0.6; filter: sepia(0.45) contrast(1.02);
        mix-blend-mode: multiply;
      }
      .lov-deck .lov-imgfull .lov-content {
        background: linear-gradient(180deg, transparent 30%, rgba(26,35,38,0.85) 100%);
        color: var(--o-paper) !important;
        justify-content: flex-end;
        padding-bottom: 8cqw;
      }
      .lov-deck .lov-imgfull .lov-h1,
      .lov-deck .lov-imgfull .lov-h2 { color: var(--o-paper) !important; }
      .lov-deck .lov-imgfull .lov-subtitle { color: rgba(248,239,216,0.9) !important; }
      .lov-deck .lov-imgfull .lov-kicker { color: var(--o-gold-2) !important; }
      .lov-deck .lov-imgfull .lov-content::before,
      .lov-deck .lov-imgfull .lov-content::after { background: var(--o-gold-2); opacity: 0.4; }

      .lov-deck .lov-imgtop .lov-content { padding-top: 4cqw; }
      .lov-deck .lov-imgtop .lov-media { aspect-ratio: 21/9; margin-bottom: 4cqw; }

      /* ── PROCESS / TIMELINE ──────────────────────────────────────── */
      .lov-deck .lov-process .lov-grid,
      .lov-deck .lov-timeline .lov-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(20cqw, 200px), 1fr));
        gap: 2.4cqw;
        margin-top: 4cqw;
      }
      .lov-deck .lov-process .lov-step-num,
      .lov-deck .lov-timeline .lov-step-num {
        font-family: "Cormorant Garamond", serif !important;
        font-style: italic;
        font-size: clamp(28px, 6.5cqw, 120px) !important;
        color: var(--o-terracotta) !important;
        line-height: 0.9;
        font-weight: 500 !important;
        display: block;
        margin-bottom: 0.8cqw;
      }
      .lov-deck .lov-process .lov-grid > *:nth-child(3n+2) .lov-step-num { color: var(--o-teal) !important; }
      .lov-deck .lov-process .lov-grid > *:nth-child(3n)   .lov-step-num { color: var(--o-gold) !important; }

      /* ── GALLERY ─────────────────────────────────────────────────── */
      .lov-deck .lov-gallery .lov-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(20cqw, 200px), 1fr));
        gap: 1.4cqw;
        margin-top: 3cqw;
      }
      .lov-deck .lov-gallery .lov-grid > * {
        padding: 0 !important;
        aspect-ratio: 1;
        overflow: hidden;
        position: relative;
        background: var(--o-card) !important;
        box-shadow:
          inset 0 0 0 0.4cqw var(--o-card),
          inset 0 0 0 0.55cqw var(--o-gold),
          inset 0 0 0 0.7cqw var(--o-card) !important;
      }
      .lov-deck .lov-gallery .lov-grid > *::before { display: none !important; }
      .lov-deck .lov-gallery .lov-grid > * img { width: 100%; height: 100%; object-fit: cover; filter: sepia(0.1); }

      /* ── COMPARE ─────────────────────────────────────────────────── */
      .lov-deck .lov-compare .lov-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3cqw;
        margin-top: 3.4cqw;
      }

      /* ── CALLOUT ─────────────────────────────────────────────────── */
      .lov-deck .lov-callout {
        background:
          radial-gradient(circle at 50% 35%, rgba(176,133,52,0.18), transparent 55%),
          var(--o-parchment) !important;
      }
      .lov-deck .lov-callout .lov-content { max-width: 85cqw; text-align: center; align-items: center; }
      .lov-deck .lov-callout .lov-callout-text { color: var(--o-teal) !important; }

      /* ── FOOTER INDEX PILL ───────────────────────────────────────── */
      .lov-deck .lov-index {
        position: absolute;
        bottom: 3.4cqw; right: 5cqw;
        color: var(--o-teal) !important;
        background: transparent !important;
        padding: 0;
        font-size: clamp(8px, 1cqw, 14px) !important;
        letter-spacing: 0.45em !important;
        z-index: 3;
        opacity: 0.75;
      }
      .lov-deck .lov-index::before {
        content: "—  ";
        opacity: 0.5;
      }

      /* ── VARIANT OVERRIDES ───────────────────────────────────────── */
      .lov-deck .lov-v-paper   { background: var(--o-parchment-2) !important; }
      .lov-deck .lov-v-filled  {
        background:
          radial-gradient(circle at 20% 10%, rgba(176,133,52,0.18), transparent 40%),
          linear-gradient(180deg, var(--o-teal) 0%, #143A40 100%) !important;
        color: var(--o-paper) !important;
      }
      .lov-deck .lov-v-filled::before,
      .lov-deck .lov-v-filled::after { display: none; }
      .lov-deck .lov-v-filled .lov-h1,
      .lov-deck .lov-v-filled .lov-h2,
      .lov-deck .lov-v-filled .lov-h3,
      .lov-deck .lov-v-filled .lov-callout-text,
      .lov-deck .lov-v-filled .lov-bignum-value,
      .lov-deck .lov-v-filled .lov-stat-value,
      .lov-deck .lov-v-filled .lov-quote { color: var(--o-paper) !important; }
      .lov-deck .lov-v-filled .lov-subtitle,
      .lov-deck .lov-v-filled .lov-body,
      .lov-deck .lov-v-filled .lov-bullets li { color: rgba(248,239,216,0.85) !important; }
      .lov-deck .lov-v-filled .lov-kicker { color: var(--o-gold-2) !important; }
      .lov-deck .lov-v-filled .lov-h1 em,
      .lov-deck .lov-v-filled .lov-h2 em { color: var(--o-gold-2); }

      .lov-deck .lov-v-outline { background: transparent !important; }
      .lov-deck .lov-v-mono    { filter: sepia(0.7) saturate(0.4); }
      .lov-deck .lov-v-gradient {
        background: linear-gradient(135deg, var(--o-parchment) 0%, var(--o-gold-2) 100%) !important;
      }

      /* ── ACCENT DECORATIONS ──────────────────────────────────────── */
      .lov-deck .lov-a-top > *::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0;
        height: 0.5cqw;
        background:
          linear-gradient(90deg, var(--o-terracotta) 0%, var(--o-gold) 50%, var(--o-teal) 100%);
        z-index: 2;
      }
      .lov-deck .lov-a-left > *::before {
        content: ""; position: absolute; top: 0; left: 0; bottom: 0;
        width: 0.5cqw;
        background:
          linear-gradient(180deg, var(--o-terracotta) 0%, var(--o-gold) 50%, var(--o-teal) 100%);
        z-index: 2;
      }
      .lov-deck .lov-a-corner > *::before {
        content: ""; position: absolute; top: 0; right: 0;
        border-top: 6cqw solid var(--o-terracotta);
        border-left: 6cqw solid transparent;
        z-index: 2;
      }
      .lov-deck .lov-a-underline .lov-h1::after,
      .lov-deck .lov-a-underline .lov-h2::after {
        content: ""; display: block;
        width: 12cqw; height: 0.35cqw; margin-top: 1.8cqw;
        background:
          linear-gradient(90deg, var(--o-terracotta) 0%, var(--o-gold) 100%);
      }
      .lov-deck .lov-a-side-bar .lov-content {
        padding-left: 11cqw !important;
        border-left: 0.6cqw solid var(--o-terracotta) !important;
      }
    </style>
  </head>

        <div class="lov-cover-veil"></div>
        <div class="lov-content">
          <div class="lov-kicker">Odyssey · Classical</div>
          <h1 class="lov-h1">The <em>Odyssey</em></h1>
          <p class="lov-subtitle">A Classical Edition</p>
        </div>
        <div class="lov-index">01 / 01</div>
      </section>
    </main>
