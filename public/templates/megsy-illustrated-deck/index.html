<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Megsy Illustrated Deck</title>

    <!-- Mali for handwritten serif headlines, Rubik for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,500;0,600;0,700;1,500;1,700&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style id="megsy-illustrated-base">
      /* =================================================================
         MEGSY ILLUSTRATED — beige paper + ink + hand-drawn characters.
         Covers all 40 slide layout types from SlidesHtmlDeckCard.
         Scoped under .lov-deck so it cannot leak into the host app.
         ================================================================= */

      :root {
        --megsy-paper:     #E5DACF;
        --megsy-paper-2:   #efe6dc;
        --megsy-card:      #f3ebe1;
        --megsy-ink:       #0a0a0a;
        --megsy-ink-soft:  #2d2926;
        --megsy-muted:     #6b625a;
        --megsy-accent:    #c45a3a;   /* terracotta */
        --megsy-accent-2:  #d9a441;   /* mustard */
        --megsy-accent-3:  #5a7a52;   /* sage */
        --megsy-shadow:    6px 6px 0 var(--megsy-ink);
        --megsy-shadow-sm: 3px 3px 0 var(--megsy-ink);
      }

      html, body { background: var(--megsy-paper); margin: 0; }

      .lov-deck {
        background: var(--megsy-paper) !important;
        color: var(--megsy-ink) !important;
        font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif !important;
      }

      .lov-deck .lov-section {
        background: var(--megsy-paper) !important;
        color: var(--megsy-ink) !important;
        position: relative;
        overflow: hidden;
      }

      /* Subtle printed-paper texture */
      .lov-deck .lov-section::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
          radial-gradient(rgba(10,10,10,0.05) 1px, transparent 1px),
          radial-gradient(rgba(196,90,58,0.04) 1px, transparent 1px);
        background-size: 22px 22px, 44px 44px;
        background-position: 0 0, 11px 11px;
        pointer-events: none;
        z-index: 0;
      }
      .lov-deck .lov-section > * { position: relative; z-index: 1; }

      /* ── Typography ──────────────────────────────────────────────── */
      .lov-deck .lov-h1,
      .lov-deck .lov-h2,
      .lov-deck .lov-h3,
      .lov-deck .lov-quote,
      .lov-deck .lov-bignum-value,
      .lov-deck .lov-stat-value {
        font-family: "Mali", "Rubik", serif !important;
        color: var(--megsy-ink) !important;
        font-weight: 700 !important;
        letter-spacing: -0.01em;
      }
      .lov-deck .lov-h1 { font-size: clamp(56px, 7vw, 120px) !important; line-height: 1.05 !important; }
      .lov-deck .lov-h2 { font-size: clamp(40px, 5vw, 84px) !important;  line-height: 1.1  !important; }
      .lov-deck .lov-h3 { font-size: clamp(28px, 3vw, 48px) !important;  line-height: 1.15 !important; }

      .lov-deck .lov-subtitle,
      .lov-deck .lov-body,
      .lov-deck .lov-bullets li,
      .lov-deck .lov-stat-label,
      .lov-deck .lov-cite {
        font-family: "Rubik", sans-serif !important;
        color: var(--megsy-ink-soft) !important;
        font-weight: 400 !important;
      }
      .lov-deck .lov-subtitle { font-size: clamp(20px, 1.8vw, 30px) !important; line-height: 1.45 !important; }
      .lov-deck .lov-body     { font-size: clamp(18px, 1.5vw, 26px) !important; line-height: 1.55 !important; }

      .lov-deck .lov-kicker,
      .lov-deck .lov-index {
        font-family: "Mali", serif !important;
        color: var(--megsy-accent) !important;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-weight: 700 !important;
      }
      .lov-deck .lov-kicker { font-size: clamp(14px, 1.1vw, 18px) !important; margin-bottom: 16px; }

      /* ── Content layout primitives ───────────────────────────────── */
      .lov-deck .lov-content {
        padding: clamp(40px, 5vw, 96px);
        max-width: 1600px;
        margin: 0 auto;
        height: 100%;
        display: flex; flex-direction: column;
        justify-content: center;
      }
      .lov-deck .lov-content-center { text-align: center; align-items: center; }

      /* ── Cards / callouts / columns: chunky ink border + offset shadow ── */
      .lov-deck .lov-callout,
      .lov-deck .lov-three > *,
      .lov-deck .lov-twocol > *,
      .lov-deck .lov-stats-section .lov-stat,
      .lov-deck .lov-process-step,
      .lov-deck .lov-timeline-item,
      .lov-deck .lov-gallery-item,
      .lov-deck .lov-comparison-side {
        background: var(--megsy-card) !important;
        border: 2.5px solid var(--megsy-ink) !important;
        border-radius: 18px !important;
        box-shadow: var(--megsy-shadow) !important;
        color: var(--megsy-ink) !important;
        padding: clamp(20px, 2vw, 32px) !important;
      }

      /* ── Images: ink-outlined photo-frames ───────────────────────── */
      .lov-deck .lov-media,
      .lov-deck img:not(.lov-cover-bg):not(.lov-deco) {
        border-radius: 16px;
      }
      .lov-deck .lov-media {
        border: 2.5px solid var(--megsy-ink);
        box-shadow: var(--megsy-shadow);
        background: var(--megsy-card);
        overflow: hidden;
      }
      .lov-deck .lov-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .lov-deck .lov-media-empty {
        display: flex; align-items: center; justify-content: center;
        color: var(--megsy-accent);
      }
      .lov-deck .lov-media-empty .lov-star-svg { width: 40%; height: 40%; }

      /* ── Cover ───────────────────────────────────────────────────── */
      .lov-deck .lov-cover {
        background:
          radial-gradient(circle at 78% 32%, rgba(196,90,58,0.20), transparent 55%),
          radial-gradient(circle at 18% 78%, rgba(217,164,65,0.18), transparent 50%),
          var(--megsy-paper) !important;
      }
      .lov-deck .lov-cover .lov-h1 {
        font-style: italic;
        text-shadow: 5px 5px 0 rgba(196,90,58,0.20);
      }
      .lov-deck .lov-cover-bg {
        position: absolute; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
        opacity: 0.18; filter: sepia(0.4) saturate(0.7);
        z-index: 0;
      }
      .lov-deck .lov-cover-veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, transparent 0%, rgba(229,218,207,0.7) 100%);
        z-index: 0;
      }

      /* Decorative hand-drawn character that floats on cover/section slides */
      .lov-deck .lov-cover::after,
      .lov-deck .lov-quote-section::after {
        content: "";
        position: absolute;
        right: 4%; bottom: 4%;
        width: clamp(180px, 22vw, 360px);
        height: clamp(180px, 22vw, 360px);
        background: url("assets/characters/img_p9_1.jpg") center/contain no-repeat;
        border: 2.5px solid var(--megsy-ink);
        border-radius: 50%;
        box-shadow: var(--megsy-shadow);
        z-index: 2;
        transform: rotate(-4deg);
      }

      /* ── Quote ───────────────────────────────────────────────────── */
      .lov-deck .lov-quote {
        font-size: clamp(36px, 4vw, 72px) !important;
        font-style: italic;
        line-height: 1.15 !important;
      }
      .lov-deck .lov-quote-mark {
        font-family: "Mali", serif;
        color: var(--megsy-accent);
        font-size: clamp(120px, 14vw, 240px);
        line-height: 0.7;
        margin-bottom: -20px;
      }
      .lov-deck .lov-cite {
        margin-top: 24px;
        font-style: italic;
        font-size: clamp(16px, 1.3vw, 22px) !important;
      }

      /* ── Stats / big-number ──────────────────────────────────────── */
      .lov-deck .lov-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: clamp(16px, 1.5vw, 28px);
        margin-top: 40px;
      }
      .lov-deck .lov-stat { text-align: center; }
      .lov-deck .lov-stat-value {
        font-size: clamp(56px, 6vw, 96px) !important;
        color: var(--megsy-accent) !important;
        display: block;
        line-height: 1;
      }
      .lov-deck .lov-stat-label {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 14px !important;
        margin-top: 12px;
      }
      .lov-deck .lov-bignum-value {
        font-size: clamp(140px, 18vw, 320px) !important;
        line-height: 0.9;
        color: var(--megsy-accent) !important;
        font-style: italic;
      }

      /* ── Bullets — hand-drawn checklist ──────────────────────────── */
      .lov-deck .lov-bullets {
        list-style: none; padding: 0; margin: 32px 0;
        display: flex; flex-direction: column; gap: 18px;
      }
      .lov-deck .lov-bullets li {
        position: relative;
        padding-left: 56px;
        font-size: clamp(18px, 1.6vw, 26px) !important;
        line-height: 1.4;
      }
      .lov-deck .lov-bullets li::before {
        content: "";
        position: absolute;
        left: 0; top: 6px;
        width: 28px; height: 28px;
        background: var(--megsy-accent);
        border: 2px solid var(--megsy-ink);
        border-radius: 6px;
        transform: rotate(-4deg);
        box-shadow: var(--megsy-shadow-sm);
      }
      .lov-deck .lov-bullets li:nth-child(2n)::before { background: var(--megsy-accent-2); transform: rotate(3deg); }
      .lov-deck .lov-bullets li:nth-child(3n)::before { background: var(--megsy-accent-3); transform: rotate(-2deg); }

      /* ── Two-column / split layouts ──────────────────────────────── */
      .lov-deck .lov-twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(24px, 3vw, 56px);
        align-items: center;
        margin-top: 32px;
      }
      .lov-deck .lov-twocol .lov-media { aspect-ratio: 4/3; }

      /* ── Three-column / pillars ──────────────────────────────────── */
      .lov-deck .lov-three {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: clamp(20px, 2vw, 36px);
        margin-top: 40px;
      }
      .lov-deck .lov-three > * { display: flex; flex-direction: column; gap: 16px; }
      .lov-deck .lov-three h3 {
        font-family: "Mali", serif !important;
        font-size: clamp(24px, 2.2vw, 36px) !important;
        color: var(--megsy-accent) !important;
        margin: 0;
      }

      /* ── Image-full / magazine-cover ─────────────────────────────── */
      .lov-deck .lov-section[data-layout="image-full"],
      .lov-deck .lov-section[data-layout="magazine-cover"],
      .lov-deck .lov-section[data-layout="diagonal-split"] {
        padding: 0;
      }
      .lov-deck .lov-section[data-layout="image-full"] .lov-cover-bg,
      .lov-deck .lov-section[data-layout="magazine-cover"] .lov-cover-bg {
        opacity: 0.6;
      }

      /* ── Process / timeline ──────────────────────────────────────── */
      .lov-deck .lov-process-grid,
      .lov-deck .lov-timeline {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: clamp(20px, 2vw, 32px);
        margin-top: 40px;
      }
      .lov-deck .lov-process-step .lov-step-num,
      .lov-deck .lov-timeline-item .lov-step-num {
        font-family: "Mali", serif !important;
        font-style: italic;
        font-size: clamp(48px, 5vw, 80px) !important;
        color: var(--megsy-accent) !important;
        line-height: 1;
      }

      /* ── Gallery / image grids ───────────────────────────────────── */
      .lov-deck .lov-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: clamp(16px, 1.5vw, 28px);
        margin-top: 32px;
      }
      .lov-deck .lov-gallery-item {
        padding: 0 !important;
        aspect-ratio: 1;
        overflow: hidden;
      }
      .lov-deck .lov-gallery-item img { width: 100%; height: 100%; object-fit: cover; }
      .lov-deck .lov-gallery-item:nth-child(2n) { transform: rotate(-2deg); }
      .lov-deck .lov-gallery-item:nth-child(3n) { transform: rotate(2deg); }

      /* ── Comparison / before-after / vs-split ────────────────────── */
      .lov-deck .lov-comparison {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 32px;
        align-items: stretch;
        margin-top: 40px;
      }
      .lov-deck .lov-comparison-vs {
        display: flex; align-items: center; justify-content: center;
        font-family: "Mali", serif;
        font-style: italic;
        font-size: clamp(48px, 5vw, 80px);
        color: var(--megsy-accent);
      }

      /* ── Callout / manifesto / pull-quote ────────────────────────── */
      .lov-deck .lov-callout {
        max-width: 1100px;
        margin: 0 auto;
        text-align: center;
        padding: clamp(40px, 5vw, 80px) !important;
        position: relative;
      }
      .lov-deck .lov-callout::before {
        content: "★";
        position: absolute;
        top: -32px; right: -32px;
        font-size: 64px;
        color: var(--megsy-accent);
        transform: rotate(15deg);
      }

      /* ── Section dividers (big numbered openers like "01") ──────── */
      .lov-deck .lov-section[data-layout="section-divider"] .lov-h2,
      .lov-deck .lov-section[data-layout*="divider"] .lov-kicker {
        font-size: clamp(120px, 16vw, 280px) !important;
        line-height: 0.9 !important;
        color: var(--megsy-ink) !important;
        font-family: "Mali", serif !important;
        font-style: italic;
        letter-spacing: -0.04em;
      }

      /* ── Footer index pill "01 / 18" ─────────────────────────────── */
      .lov-deck .lov-index {
        position: absolute;
        bottom: 24px; right: 32px;
        background: var(--megsy-ink) !important;
        color: var(--megsy-paper) !important;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 12px !important;
        letter-spacing: 0.15em;
        z-index: 3;
      }

      /* ── Variant overrides (8 surface styles from renderer) ──────── */
      .lov-deck .lov-v-paper { background: var(--megsy-paper-2) !important; }
      .lov-deck .lov-v-filled { background: var(--megsy-accent) !important; color: var(--megsy-paper) !important; }
      .lov-deck .lov-v-filled .lov-h1, .lov-deck .lov-v-filled .lov-h2 { color: var(--megsy-paper) !important; }
      .lov-deck .lov-v-outline { background: transparent !important; }
      .lov-deck .lov-v-mono { filter: grayscale(1); }
      .lov-deck .lov-v-gradient {
        background: linear-gradient(135deg, var(--megsy-paper) 0%, var(--megsy-accent-2) 100%) !important;
      }

      /* ── Accent decorations (5 styles from renderer) ─────────────── */
      .lov-deck .lov-a-top::after {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
        background: var(--megsy-accent); z-index: 2;
      }
      .lov-deck .lov-a-left::after {
        content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 8px;
        background: var(--megsy-accent); z-index: 2;
      }
      .lov-deck .lov-a-corner::after {
        content: ""; position: absolute; top: 0; right: 0;
        border-top: 80px solid var(--megsy-accent);
        border-left: 80px solid transparent;
        z-index: 2;
      }
      .lov-deck .lov-a-underline .lov-h1::after,
      .lov-deck .lov-a-underline .lov-h2::after {
        content: ""; display: block;
        width: 120px; height: 6px; margin-top: 16px;
        background: var(--megsy-accent);
        border-radius: 3px;
      }
      .lov-deck .lov-a-side-bar { padding-left: 60px !important; border-left: 12px solid var(--megsy-accent) !important; }
    </style>
  </head>
  <body>
    <!--
      The renderer (SlidesHtmlDeckCard) wipes this body and injects
      AI-generated <section class="lov-section"> markup inside <main class="lov-deck">.
      The CSS above is what makes the slides feel "Megsy Illustrated".
      The static fallback below makes the raw template URL viewable.
    -->
    <main class="lov-deck">
      <section class="lov-section lov-cover">
        <div class="lov-content lov-content-center">
          <div class="lov-kicker">Megsy Illustrated</div>
          <h1 class="lov-h1">Critical Thinking</h1>
          <p class="lov-subtitle">Enhancing analytical skills for better decision-making.</p>
        </div>
        <div class="lov-index">01 / 20</div>
      </section>
    </main>
  </body>
</html>
