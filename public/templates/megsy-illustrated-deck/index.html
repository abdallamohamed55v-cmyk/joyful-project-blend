<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Megsy Illustrated Deck</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600;1,9..144,800&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

    <style id="megsy-illustrated-base">
      /* =================================================================
         MEGSY ILLUSTRATED — warm paper editorial.
         Beige paper · ink · terracotta · mustard · sage.
         Fraunces serif (variable), Inter body, Caveat handwritten accent.
         All sizing in container-query units (cqw/cqh) so slides scale
         perfectly inside the chat card on mobile + desktop.
         ================================================================= */

      :root {
        --m-paper:    #ECE1D1;
        --m-paper-2:  #F4EBDC;
        --m-card:     #FAF3E5;
        --m-ink:      #0B0B0B;
        --m-ink-2:    #2A2622;
        --m-muted:    #6E665B;
        --m-rust:     #C0512F;   /* terracotta */
        --m-mustard:  #D9A441;
        --m-sage:     #5C7A55;
        --m-rule:     rgba(11,11,11,0.12);
      }

      html, body { background: var(--m-paper); margin: 0; }

      .lov-deck {
        background: var(--m-paper) !important;
        color: var(--m-ink) !important;
        font-family: "Inter", system-ui, -apple-system, sans-serif !important;
      }

      .lov-deck .lov-section {
        background: var(--m-paper) !important;
        color: var(--m-ink) !important;
        position: relative;
        overflow: hidden;
      }

      /* Printed-paper grain */
      .lov-deck .lov-section::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
          radial-gradient(rgba(11,11,11,0.045) 1px, transparent 1.4px),
          radial-gradient(rgba(192,81,47,0.04) 1px, transparent 1.4px);
        background-size: 2.2cqw 2.2cqw, 4.4cqw 4.4cqw;
        background-position: 0 0, 1.1cqw 1.1cqw;
        pointer-events: none;
        z-index: 0;
      }
      .lov-deck .lov-section > * { position: relative; z-index: 1; }

      /* Decorative editorial spine number on every slide */
      .lov-deck .lov-section[data-slide]::after {
        content: "Megsy  ·  Édition Limitée";
        position: absolute;
        left: 4cqw; top: 50%;
        transform: rotate(-90deg) translateX(50%);
        transform-origin: left top;
        font-family: "Inter", sans-serif;
        font-size: 0.95cqw;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        color: var(--m-ink);
        opacity: 0.35;
        z-index: 2;
        white-space: nowrap;
        pointer-events: none;
      }

      /* ── Typography (all cqw) ──────────────────────────────────────── */
      .lov-deck .lov-h1,
      .lov-deck .lov-h2,
      .lov-deck .lov-h3,
      .lov-deck .lov-quote,
      .lov-deck .lov-bignum-value,
      .lov-deck .lov-stat-value,
      .lov-deck .lov-callout-text {
        font-family: "Fraunces", "Cormorant Garamond", Georgia, serif !important;
        color: var(--m-ink) !important;
        font-weight: 600 !important;
        letter-spacing: -0.022em !important;
        font-variation-settings: "opsz" 144, "SOFT" 100;
      }
      .lov-deck .lov-h1 { font-size: clamp(26px, 9.2cqw, 200px) !important; line-height: 0.96 !important; font-weight: 700 !important; }
      .lov-deck .lov-h2 { font-size: clamp(22px, 6.8cqw, 150px) !important; line-height: 1.0  !important; }
      .lov-deck .lov-h3 { font-size: clamp(16px, 3.4cqw, 72px)  !important; line-height: 1.12 !important; font-weight: 700 !important; }
      .lov-deck .lov-callout-text {
        font-size: clamp(20px, 6cqw, 130px) !important;
        line-height: 1.05 !important;
        font-style: italic;
      }

      .lov-deck .lov-subtitle,
      .lov-deck .lov-body,
      .lov-deck .lov-bullets li,
      .lov-deck .lov-stat-label,
      .lov-deck .lov-cite {
        font-family: "Inter", sans-serif !important;
        color: var(--m-ink-2) !important;
        font-weight: 400 !important;
      }
      .lov-deck .lov-subtitle { font-size: clamp(12px, 2.1cqw, 40px) !important; line-height: 1.42 !important; max-width: 78cqw; }
      .lov-deck .lov-body     { font-size: clamp(11px, 1.7cqw, 30px) !important; line-height: 1.55 !important; max-width: 78cqw; }

      .lov-deck .lov-kicker,
      .lov-deck .lov-index {
        font-family: "Inter", sans-serif !important;
        color: var(--m-rust) !important;
        text-transform: uppercase;
        letter-spacing: 0.32em !important;
        font-weight: 700 !important;
      }
      .lov-deck .lov-kicker {
        font-size: clamp(9px, 1.1cqw, 18px) !important;
        margin-bottom: 1.6cqw;
        display: inline-flex; align-items: center; gap: 0.8cqw;
      }
      .lov-deck .lov-kicker::before {
        content: ""; display: inline-block;
        width: 2.4cqw; height: 0.22cqw;
        background: var(--m-rust);
      }

      /* ── Content layout primitives ───────────────────────────────── */
      .lov-deck .lov-content {
        padding: 7cqw 7.5cqw 7cqw 9cqw;
        height: 100%;
        display: flex; flex-direction: column;
        justify-content: center;
      }
      .lov-deck .lov-content-center { text-align: center; align-items: center; padding-left: 7.5cqw; }
      .lov-deck .lov-content-center .lov-subtitle,
      .lov-deck .lov-content-center .lov-body { margin-left: auto; margin-right: auto; }

      /* ── Cards / callouts: chunky offset shadow card ──────────────── */
      .lov-deck .lov-three > *,
      .lov-deck .lov-twocol > *,
      .lov-deck .lov-stats-section .lov-stat,
      .lov-deck .lov-process .lov-step,
      .lov-deck .lov-timeline > *,
      .lov-deck .lov-gallery > *,
      .lov-deck .lov-compare > * {
        background: var(--m-card) !important;
        border: 0.22cqw solid var(--m-ink) !important;
        border-radius: 1.4cqw !important;
        box-shadow: 0.7cqw 0.7cqw 0 var(--m-ink) !important;
        color: var(--m-ink) !important;
        padding: 3cqw 2.8cqw !important;
      }

      /* ── Images: ink-outlined frames with offset shadow ──────────── */
      .lov-deck .lov-media {
        border: 0.22cqw solid var(--m-ink);
        border-radius: 1.4cqw;
        box-shadow: 0.7cqw 0.7cqw 0 var(--m-ink);
        background: var(--m-card);
        overflow: hidden;
        aspect-ratio: 4/3;
        position: relative;
      }
      .lov-deck .lov-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .lov-deck .lov-media-empty {
        display: flex; align-items: center; justify-content: center;
        color: var(--m-rust);
      }
      .lov-deck .lov-media-empty .lov-star-svg { width: 38%; height: 38%; }

      /* ── COVER ───────────────────────────────────────────────────── */
      .lov-deck .lov-cover {
        background:
          radial-gradient(circle at 82% 24%, rgba(192,81,47,0.22), transparent 48%),
          radial-gradient(circle at 14% 82%, rgba(217,164,65,0.20), transparent 46%),
          var(--m-paper) !important;
      }
      .lov-deck .lov-cover .lov-content {
        align-items: flex-start; text-align: left;
        padding: 8cqw 9cqw;
      }
      .lov-deck .lov-cover.lov-content-center .lov-content,
      .lov-deck .lov-cover .lov-content-center { align-items: flex-start; text-align: left; }
      .lov-deck .lov-cover .lov-h1 {
        font-style: italic;
        font-weight: 800 !important;
        font-size: clamp(32px, 12cqw, 260px) !important;
        max-width: 95%;
      }
      .lov-deck .lov-cover .lov-h1::after {
        content: ".";
        color: var(--m-rust);
      }
      .lov-deck .lov-cover .lov-subtitle {
        margin-top: 3cqw;
        font-family: "Caveat", cursive !important;
        font-size: clamp(16px, 3.4cqw, 64px) !important;
        color: var(--m-ink) !important;
        font-weight: 500 !important;
        max-width: 70cqw;
      }
      .lov-deck .lov-cover-bg {
        position: absolute; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
        opacity: 0.22; filter: sepia(0.5) saturate(0.7) contrast(0.95);
        z-index: 0; mix-blend-mode: multiply;
      }
      .lov-deck .lov-cover-veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(236,225,209,0.2) 0%, rgba(236,225,209,0.85) 100%);
        z-index: 0;
      }

      /* Hand-drawn star ornament floating on cover */
      .lov-deck .lov-cover::before,
      .lov-deck .lov-quote-section::before {
        content: "";
        position: absolute;
        right: 6cqw; top: 8cqw;
        width: 14cqw; height: 14cqw;
        background:
          conic-gradient(from 0deg, var(--m-rust) 0 8.33%, transparent 0 16.66%,
                                    var(--m-rust) 0 25%,    transparent 0 33.33%,
                                    var(--m-rust) 0 41.66%, transparent 0 50%,
                                    var(--m-rust) 0 58.33%, transparent 0 66.66%,
                                    var(--m-rust) 0 75%,    transparent 0 83.33%,
                                    var(--m-rust) 0 91.66%, transparent 0 100%);
        -webkit-mask: radial-gradient(circle, black 38%, transparent 39%);
                mask: radial-gradient(circle, black 38%, transparent 39%);
        z-index: 2; pointer-events: none;
        transform: rotate(8deg);
        background-image:
          conic-gradient(from 0deg,
            var(--m-ink) 0 4%, var(--m-rust) 4% 8%,
            var(--m-ink) 8% 12%, var(--m-rust) 12% 16%,
            var(--m-ink) 16% 20%, var(--m-rust) 20% 24%,
            var(--m-ink) 24% 28%, var(--m-rust) 28% 32%,
            var(--m-ink) 32% 36%, var(--m-rust) 36% 40%,
            var(--m-ink) 40% 44%, var(--m-rust) 44% 48%,
            var(--m-ink) 48% 52%, var(--m-rust) 52% 56%,
            var(--m-ink) 56% 60%, var(--m-rust) 60% 64%,
            var(--m-ink) 64% 68%, var(--m-rust) 68% 72%,
            var(--m-ink) 72% 76%, var(--m-rust) 76% 80%,
            var(--m-ink) 80% 84%, var(--m-rust) 84% 88%,
            var(--m-ink) 88% 92%, var(--m-rust) 92% 96%,
            var(--m-ink) 96% 100%);
      }

      /* ── QUOTE ───────────────────────────────────────────────────── */
      .lov-deck .lov-quote-section { background: var(--m-paper-2) !important; }
      .lov-deck .lov-quote {
        font-size: clamp(20px, 5.2cqw, 110px) !important;
        font-style: italic;
        font-weight: 500 !important;
        line-height: 1.12 !important;
        max-width: 80cqw;
        color: var(--m-ink) !important;
      }
      .lov-deck .lov-quote-mark {
        font-family: "Fraunces", serif !important;
        color: var(--m-rust) !important;
        font-size: clamp(80px, 22cqw, 460px) !important;
        line-height: 0.55;
        font-style: italic;
        margin-bottom: -2cqw;
        font-weight: 800;
      }
      .lov-deck .lov-cite {
        margin-top: 3cqw;
        font-style: italic;
        font-size: clamp(11px, 1.5cqw, 24px) !important;
        letter-spacing: 0.05em !important;
        color: var(--m-muted) !important;
      }

      /* ── STATS ───────────────────────────────────────────────────── */
      .lov-deck .lov-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(18cqw, 200px), 1fr));
        gap: 2.6cqw;
        margin-top: 4cqw;
        width: 100%;
      }
      .lov-deck .lov-stat { text-align: left !important; }
      .lov-deck .lov-stat-value {
        font-size: clamp(36px, 8.5cqw, 180px) !important;
        color: var(--m-rust) !important;
        display: block;
        line-height: 0.95;
        font-style: italic;
        font-weight: 800 !important;
      }
      .lov-deck .lov-stat:nth-child(3n+2) .lov-stat-value { color: var(--m-mustard) !important; }
      .lov-deck .lov-stat:nth-child(3n) .lov-stat-value { color: var(--m-sage) !important; }
      .lov-deck .lov-stat-label {
        text-transform: uppercase;
        letter-spacing: 0.18em !important;
        font-size: clamp(9px, 1.05cqw, 16px) !important;
        margin-top: 1.4cqw;
        color: var(--m-ink-2) !important;
        font-weight: 600 !important;
      }
      .lov-deck .lov-bignum-value {
        font-size: clamp(72px, 24cqw, 520px) !important;
        line-height: 0.85;
        color: var(--m-rust) !important;
        font-style: italic;
        font-weight: 800 !important;
      }
      .lov-deck .lov-bignum-label {
        font-family: "Inter", sans-serif !important;
        font-size: clamp(11px, 1.5cqw, 26px) !important;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: var(--m-ink-2) !important;
        margin-top: 1.2cqw;
        font-weight: 600 !important;
      }

      /* ── BULLETS — hand-checked list ─────────────────────────────── */
      .lov-deck .lov-bullets {
        list-style: none; padding: 0; margin: 3.4cqw 0 0 0;
        display: flex; flex-direction: column; gap: 1.8cqw;
        max-width: 80cqw;
      }
      .lov-deck .lov-bullets li {
        position: relative;
        padding-left: 5.5cqw;
        font-size: clamp(12px, 1.85cqw, 32px) !important;
        line-height: 1.4 !important;
        color: var(--m-ink-2) !important;
      }
      .lov-deck .lov-bullets li::before {
        content: "";
        position: absolute;
        left: 0; top: 0.55cqw;
        width: 2.6cqw; height: 2.6cqw;
        background: var(--m-rust);
        border: 0.2cqw solid var(--m-ink);
        border-radius: 0.5cqw;
        transform: rotate(-5deg);
        box-shadow: 0.35cqw 0.35cqw 0 var(--m-ink);
      }
      .lov-deck .lov-bullets li::after {
        content: "✓";
        position: absolute;
        left: 0.4cqw; top: 0.1cqw;
        width: 2.6cqw; height: 2.6cqw;
        display: flex; align-items: center; justify-content: center;
        color: var(--m-paper);
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 2.4cqw;
        transform: rotate(-8deg);
      }
      .lov-deck .lov-bullets li:nth-child(2n)::before { background: var(--m-mustard); transform: rotate(4deg); }
      .lov-deck .lov-bullets li:nth-child(3n)::before { background: var(--m-sage); transform: rotate(-2deg); }

      /* ── TWO-COL / SPLIT ─────────────────────────────────────────── */
      .lov-deck .lov-twocol .lov-content,
      .lov-deck .lov-twocol > .lov-content {
        display: grid !important;
        grid-template-columns: 1.05fr 1fr;
        gap: 4cqw;
        align-items: center;
      }
      .lov-deck .lov-twocol > * {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .lov-deck .lov-twocol .lov-media { aspect-ratio: 4/5; height: 100%; }

      /* ── THREE-COL / PILLARS ─────────────────────────────────────── */
      .lov-deck .lov-three .lov-grid,
      .lov-deck .lov-three > .lov-content .lov-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2.4cqw;
        margin-top: 4cqw;
      }
      .lov-deck .lov-three .lov-grid > * {
        display: flex; flex-direction: column; gap: 1.4cqw;
        position: relative;
      }
      .lov-deck .lov-three .lov-grid > *::before {
        counter-increment: pillar;
        content: counter(pillar, decimal-leading-zero);
        font-family: "Fraunces", serif;
        font-style: italic;
        font-size: 4cqw;
        color: var(--m-rust);
        font-weight: 800;
        line-height: 1;
      }
      .lov-deck .lov-three > .lov-content { counter-reset: pillar; }
      .lov-deck .lov-three .lov-grid > *:nth-child(3n+2)::before { color: var(--m-mustard); }
      .lov-deck .lov-three .lov-grid > *:nth-child(3n)::before   { color: var(--m-sage); }
      .lov-deck .lov-three h3,
      .lov-deck .lov-three .lov-grid h3 {
        font-family: "Fraunces", serif !important;
        font-size: clamp(15px, 2.6cqw, 44px) !important;
        color: var(--m-ink) !important;
        margin: 0;
        font-weight: 700 !important;
      }
      .lov-deck .lov-three .lov-grid p {
        font-size: clamp(11px, 1.5cqw, 24px) !important;
        line-height: 1.45 !important;
        color: var(--m-ink-2) !important;
        margin: 0;
      }

      /* ── IMAGE FULL / IMG-TOP / CENTERED ─────────────────────────── */
      .lov-deck .lov-imgfull { padding: 0; }
      .lov-deck .lov-imgfull .lov-cover-bg {
        opacity: 0.55; filter: sepia(0.3) contrast(1.02);
        mix-blend-mode: multiply;
      }
      .lov-deck .lov-imgfull .lov-content {
        background: linear-gradient(180deg, transparent 35%, rgba(11,11,11,0.78) 100%);
        color: var(--m-paper) !important;
        justify-content: flex-end;
        padding-bottom: 7cqw;
      }
      .lov-deck .lov-imgfull .lov-h1,
      .lov-deck .lov-imgfull .lov-h2 { color: var(--m-paper) !important; }
      .lov-deck .lov-imgfull .lov-subtitle { color: rgba(250,243,229,0.88) !important; }
      .lov-deck .lov-imgfull .lov-kicker { color: var(--m-mustard) !important; }

      .lov-deck .lov-imgtop .lov-content { padding-top: 3cqw; }
      .lov-deck .lov-imgtop .lov-media { aspect-ratio: 21/9; margin-bottom: 4cqw; }

      /* ── PROCESS / TIMELINE ──────────────────────────────────────── */
      .lov-deck .lov-process .lov-grid,
      .lov-deck .lov-timeline .lov-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(20cqw, 200px), 1fr));
        gap: 2.4cqw;
        margin-top: 4cqw;
      }
      .lov-deck .lov-process .lov-step-num,
      .lov-deck .lov-timeline .lov-step-num {
        font-family: "Fraunces", serif !important;
        font-style: italic;
        font-size: clamp(28px, 6cqw, 110px) !important;
        color: var(--m-rust) !important;
        line-height: 0.9;
        font-weight: 800 !important;
        display: block;
        margin-bottom: 0.8cqw;
      }
      .lov-deck .lov-process .lov-grid > *:nth-child(3n+2) .lov-step-num { color: var(--m-mustard) !important; }
      .lov-deck .lov-process .lov-grid > *:nth-child(3n)   .lov-step-num { color: var(--m-sage) !important; }

      /* ── GALLERY ─────────────────────────────────────────────────── */
      .lov-deck .lov-gallery .lov-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(20cqw, 200px), 1fr));
        gap: 2cqw;
        margin-top: 3cqw;
      }
      .lov-deck .lov-gallery .lov-grid > * {
        padding: 0 !important;
        aspect-ratio: 1;
        overflow: hidden;
        position: relative;
      }
      .lov-deck .lov-gallery .lov-grid > * img { width: 100%; height: 100%; object-fit: cover; }
      .lov-deck .lov-gallery .lov-grid > *:nth-child(3n+1) { transform: rotate(-1.5deg); }
      .lov-deck .lov-gallery .lov-grid > *:nth-child(3n)   { transform: rotate(1.5deg); }

      /* ── COMPARE ─────────────────────────────────────────────────── */
      .lov-deck .lov-compare .lov-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3cqw;
        margin-top: 3.4cqw;
        position: relative;
      }
      .lov-deck .lov-compare .lov-grid > *:nth-child(1) { transform: rotate(-0.6deg); }
      .lov-deck .lov-compare .lov-grid > *:nth-child(2) { transform: rotate(0.6deg); }

      /* ── CALLOUT / MANIFESTO ─────────────────────────────────────── */
      .lov-deck .lov-callout {
        background:
          radial-gradient(circle at 50% 40%, rgba(217,164,65,0.18), transparent 55%),
          var(--m-paper) !important;
      }
      .lov-deck .lov-callout .lov-content {
        max-width: 85cqw; text-align: center;
      }
      .lov-deck .lov-callout::before {
        content: "✦";
        position: absolute;
        top: 6cqw; left: 50%;
        transform: translateX(-50%);
        font-size: 4cqw;
        color: var(--m-rust);
        z-index: 2;
      }

      /* ── FOOTER INDEX PILL "01 / 18" ─────────────────────────────── */
      .lov-deck .lov-index {
        position: absolute;
        bottom: 3cqw; right: 4cqw;
        background: var(--m-ink) !important;
        color: var(--m-paper) !important;
        padding: 0.8cqw 1.8cqw;
        border-radius: 999px;
        font-size: clamp(8px, 0.95cqw, 14px) !important;
        letter-spacing: 0.22em !important;
        z-index: 3;
      }

      /* ── VARIANT OVERRIDES ───────────────────────────────────────── */
      .lov-deck .lov-v-paper   { background: var(--m-paper-2) !important; }
      .lov-deck .lov-v-filled  { background: var(--m-ink) !important; color: var(--m-paper) !important; }
      .lov-deck .lov-v-filled .lov-h1,
      .lov-deck .lov-v-filled .lov-h2,
      .lov-deck .lov-v-filled .lov-h3,
      .lov-deck .lov-v-filled .lov-callout-text,
      .lov-deck .lov-v-filled .lov-bignum-value,
      .lov-deck .lov-v-filled .lov-stat-value { color: var(--m-paper) !important; }
      .lov-deck .lov-v-filled .lov-subtitle,
      .lov-deck .lov-v-filled .lov-body,
      .lov-deck .lov-v-filled .lov-bullets li { color: rgba(236,225,209,0.85) !important; }
      .lov-deck .lov-v-filled .lov-kicker { color: var(--m-mustard) !important; }

      .lov-deck .lov-v-outline { background: transparent !important; }
      .lov-deck .lov-v-mono    { filter: grayscale(1) contrast(1.05); }
      .lov-deck .lov-v-gradient {
        background: linear-gradient(135deg, var(--m-paper) 0%, var(--m-mustard) 100%) !important;
      }
      .lov-deck .lov-v-glass {
        background:
          linear-gradient(135deg, rgba(250,243,229,0.6), rgba(236,225,209,0.4)),
          radial-gradient(circle at 30% 20%, var(--m-mustard), var(--m-rust)) !important;
      }

      /* ── ACCENT DECORATIONS ──────────────────────────────────────── */
      .lov-deck .lov-a-top::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0;
        height: 1.2cqw;
        background: repeating-linear-gradient(90deg,
          var(--m-rust) 0 4cqw, var(--m-mustard) 4cqw 8cqw, var(--m-sage) 8cqw 12cqw, var(--m-ink) 12cqw 16cqw);
        z-index: 2;
      }
      .lov-deck .lov-a-left::before {
        content: ""; position: absolute; top: 0; left: 0; bottom: 0;
        width: 1.2cqw;
        background: repeating-linear-gradient(0deg,
          var(--m-rust) 0 4cqw, var(--m-mustard) 4cqw 8cqw, var(--m-sage) 8cqw 12cqw, var(--m-ink) 12cqw 16cqw);
        z-index: 2;
      }
      .lov-deck .lov-a-corner::before {
        content: ""; position: absolute; top: 0; right: 0;
        border-top: 8cqw solid var(--m-rust);
        border-left: 8cqw solid transparent;
        z-index: 2;
      }
      .lov-deck .lov-a-underline .lov-h1::after,
      .lov-deck .lov-a-underline .lov-h2::after {
        content: ""; display: block;
        width: 14cqw; height: 0.7cqw; margin-top: 1.6cqw;
        background: var(--m-rust);
        border-radius: 0.5cqw;
      }
      .lov-deck .lov-a-side-bar .lov-content {
        padding-left: 11cqw !important;
        border-left: 1.4cqw solid var(--m-rust) !important;
      }
    </style>
  </head>
  <body>
    <main class="lov-deck">
      <section class="lov-section lov-cover" data-slide="0">
        <div class="lov-cover-veil"></div>
        <div class="lov-content">
          <div class="lov-kicker">Megsy Illustrated</div>
          <h1 class="lov-h1">Critical Thinking</h1>
          <p class="lov-subtitle">An editorial deck for ideas worth lingering on</p>
        </div>
        <div class="lov-index">01 / 01</div>
      </section>
    </main>
  </body>
